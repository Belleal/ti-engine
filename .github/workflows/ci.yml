name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ current, master ]

# Nothing here writes: it lints, tests and builds an image without pushing. `npm install` runs
# dependency lifecycle scripts, so the token those scripts could reach is held to read-only rather
# than left at the repository default.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # core's live-instance suite (CA-560) starts real providers, which need a real Redis: the hang it pins lives in
    # what the catalog, the roster and the heartbeat keys hold, which no stub reproduces. Without a server it skips,
    # so a developer without Redis still gets a green run; TI_TEST_REDIS_REQUIRED makes it fail here instead, so CI
    # never passes by skipping it. Redis 8 carries the JSON module the framework's document methods need.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Node version is written once, in .nvmrc, and read from there by this job, by
      # npm-publish.yml and by a developer's version manager. Testing on one major and developing on
      # another is not harmless: Node 22's runner exits 0 when a describe callback throws, where 24's
      # fails the run, so a suite that breaks while building its fixtures passed locally and failed
      # here (CA-403). The tester image and the Cloudflare template name the same major in their FROM
      # lines, which cannot read the file, so a move to the next LTS changes those with it.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # No npm cache: it keys off package-lock.json, which is gitignored in this repo.
      # setup-node's automatic cache also stays off by itself, because it only activates when
      # package.json declares `packageManager` / `devEngines.packageManager` and none of ours do.
      # Adding such a field would silently switch caching on here — pass
      # `package-manager-cache: false` if that ever happens.
      - name: Install dependencies
        run: npm install
      # web-framework bundles htmx and Alpine's CSP build as committed files, which its postinstall copies
      # from node_modules on every install, as it just did. The publish job packs what is committed, with
      # no install, so a bundled copy that this install changed is a stale one about to ship: 1.39.0 to
      # 1.46.0 carried htmx 2.0.10 while declaring ^2.0.11 (CA-402). Both are pinned exactly, so this fails
      # on a change that moves a pin without the regenerated files, and on nothing an upstream release does.
      - name: Bundled browser libraries match their pinned versions
        run: |
          if ! git diff --quiet -- packages/web-framework/bin/static/scripts/lib/; then
            git diff --stat -- packages/web-framework/bin/static/scripts/lib/
            echo "::error::The bundled htmx/Alpine copies are not the pinned versions. Run npm install and commit packages/web-framework/bin/static/scripts/lib/."
            exit 1
          fi
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm test --workspaces --if-present
        env:
          TI_TEST_REDIS_REQUIRED: "true"
      # Rebuilds the published declarations, fails if the committed output is stale, and type-checks
      # both the declarations and a consumer that imports every public subpath — all with
      # `skipLibCheck: false`, which is TypeScript's default and the setting under which the
      # declarations are actually read.
      - name: Type declarations
        run: npm run check:types

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/tester/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
