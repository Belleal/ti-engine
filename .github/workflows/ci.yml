name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ current, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # No npm cache: it keys off package-lock.json, which is gitignored in this repo.
      # setup-node's automatic cache also stays off by itself, because it only activates when
      # package.json declares `packageManager` / `devEngines.packageManager` and none of ours do.
      # Adding such a field would silently switch caching on here — pass
      # `package-manager-cache: false` if that ever happens.
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm test --workspaces --if-present
      - name: JSON config validation
        run: npm run test:json -w @ti-engine/competence
      # The published type declarations are generated from each package's JSDoc and committed, because
      # the publish job deliberately installs nothing and runs no lifecycle scripts. Committed
      # generated output drifts the moment someone edits a source and forgets to regenerate, so
      # regenerate here and fail if the result differs from what is in the tree.
      - name: Type declarations are current
        run: |
          stale=0
          for package in core web-framework web-content; do
            npm run build:types -w "@ti-engine/$package"
            if [ -n "$( git status --porcelain -- "packages/$package/types" )" ]; then
              echo "::error::packages/$package/types is stale. Run 'npm run build:types -w @ti-engine/$package' and commit the result."
              git status --short -- "packages/$package/types"
              stale=1
            fi
          done
          [ "$stale" -eq 0 ] || exit 1
          echo "Type declarations match the sources in every package that ships them."

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/competence/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
