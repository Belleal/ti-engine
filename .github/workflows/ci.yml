name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ current, master ]

# Nothing here writes: it lints, tests and builds an image without pushing. `npm install` runs
# dependency lifecycle scripts, so the token those scripts could reach is held to read-only rather
# than left at the repository default.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # No npm cache: it keys off package-lock.json, which is gitignored in this repo.
      # setup-node's automatic cache also stays off by itself, because it only activates when
      # package.json declares `packageManager` / `devEngines.packageManager` and none of ours do.
      # Adding such a field would silently switch caching on here — pass
      # `package-manager-cache: false` if that ever happens.
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm test --workspaces --if-present
      - name: JSON config validation
        run: npm run test:json -w @ti-engine/competence
      # Rebuilds the published declarations, fails if the committed output is stale, and type-checks
      # both the declarations and a consumer that imports every public subpath — all with
      # `skipLibCheck: false`, which is TypeScript's default and the setting under which the
      # declarations are actually read.
      - name: Type declarations
        run: npm run check:types

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/competence/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
