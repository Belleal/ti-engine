name: CD

on:
  push:
    branches: [ master ]
    tags: [ 'competence-v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'competence version to release, e.g. 3.31.0 — must match packages/competence/package.json at the ref you run this from'
        required: true
        type: string

jobs:
  # Dispatch-only, and the only job that holds `contents: write`. Kept separate from `publish` so repository
  # write access is never live in the same job as the image build or the Google workload-identity token.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.create.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version must match package.json at the checked-out ref, which makes it impossible to tag a commit
      # that declares a different version — and means a back-dated release is simply dispatched from the commit
      # that declares it.
      - name: Validate and create the release tag
        id: create
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a semantic version (expected e.g. 3.31.0)." ; exit 1 ;;
          esac

          PKG_VERSION="$( node -p "require('./packages/competence/package.json').version" )"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Requested $VERSION but packages/competence/package.json at ${GITHUB_SHA} declares $PKG_VERSION. Dispatch this workflow from the commit that declares the version you are releasing."
            exit 1
          fi

          TAG="competence-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Releases are immutable — bump the version instead."
            exit 1
          fi

          # actions/checkout persists GITHUB_TOKEN in the credential helper, so this push is already authenticated.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "competence $VERSION"
          git push origin "$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Created $TAG at ${GITHUB_SHA}"

  publish:
    needs: [ tag ]
    # `tag` is skipped on a push event and must succeed on a dispatch; both cases publish. `!cancelled()` rather
    # than `always()` so a cancelled run does not go on to push images.
    if: ${{ !cancelled() && ( needs.tag.result == 'success' || needs.tag.result == 'skipped' ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/belleal/ti-engine-competence
            europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/competence/ti-engine-competence
          # `match` covers a tag pushed by a human. The two `raw` entries cover the dispatch path, where
          # `github.ref` is a branch and so `match` yields nothing; both are inert on a push (`enable=false`).
          tags: |
            type=edge,branch=master
            type=sha
            type=match,pattern=competence-v(.*),group=1
            type=raw,value=${{ needs.tag.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/competence-v') || github.event_name == 'workflow_dispatch' }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/competence/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
