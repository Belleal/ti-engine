name: CD

on:
  push:
    branches: [ master ]
    tags: [ 'competence-v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'competence version to release, e.g. 3.31.0 — must match packages/competence/package.json on master'
        required: true
        type: string

# No workflow-wide grant: every job below states the scopes it needs and nothing more.
permissions: {}

jobs:
  # Dispatch-only, and the only job that holds `contents: write`. Kept separate from `publish` so repository
  # write access is never live in the same job as the image build or the Google workload-identity token.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # To create and push the release tag. Nothing else in this job needs a scope.
      contents: write
    outputs:
      version: ${{ steps.create.outputs.version }}
    steps:
      - name: Checkout
        # Credentials are deliberately persisted here: the tag push below authenticates with them.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and create the release tag
        id: create
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # workflow_dispatch can only target a branch or a tag — never a bare commit ("No ref found for: <sha>")
          # — and the Google workload-identity provider created by packages/competence/deploy/gcp/bootstrap.sh
          # only trusts `refs/heads/master` or `refs/tags/competence-v*`. Dispatching from anywhere else would
          # create the tag and then fail at Google authentication, leaving a release tag with no images. Refuse
          # first, so an unauthorized dispatch stops with no side effects.
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::Releases are dispatched from master; this run is on '$REF'. To release an older commit, push the tag by hand (see packages/competence/INSTALL.md §4)."
            exit 1
          fi

          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a semantic version (expected e.g. 3.31.0)." ; exit 1 ;;
          esac

          # The version must match package.json at the checked-out commit, so a tag can never point at a commit
          # declaring a different version.
          PKG_VERSION="$( node -p "require('./packages/competence/package.json').version" )"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Requested $VERSION but packages/competence/package.json at ${GITHUB_SHA} declares $PKG_VERSION. Bump the version on master before releasing it."
            exit 1
          fi

          TAG="competence-v$VERSION"

          # `refs/tags/X^{}` is the peeled commit of an annotated tag and empty for a lightweight one, where
          # `refs/tags/X` is already the commit — so this resolves the tag's target either way.
          PEELED="$( git ls-remote origin "refs/tags/$TAG^{}" | cut -f1 )"
          PLAIN="$( git ls-remote origin "refs/tags/$TAG" | cut -f1 )"
          TARGET="${PEELED:-$PLAIN}"

          if [ -n "$TARGET" ]; then
            if [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists at $TARGET, not ${GITHUB_SHA}. Releases are immutable — bump the version instead."
              exit 1
            fi
            # Same commit: the tag was created by an earlier run whose publish did not finish. Re-dispatching is
            # the retry, so hand the version on and let `publish` run again rather than failing on our own tag.
            echo "Tag $TAG already points at ${GITHUB_SHA}; re-publishing without recreating it."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # actions/checkout persists GITHUB_TOKEN in the credential helper, so this push is already authenticated.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "competence $VERSION"
          git push origin "$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Created $TAG at ${GITHUB_SHA}"

  publish:
    needs: [ tag ]
    # `tag` is skipped on a push event and must succeed on a dispatch; both cases publish. `!cancelled()` rather
    # than `always()` so a cancelled run does not go on to push images.
    if: ${{ !cancelled() && ( needs.tag.result == 'success' || needs.tag.result == 'skipped' ) }}
    runs-on: ubuntu-latest
    permissions:
      # Read the source, push images to GHCR, and mint the OIDC token for Google workload identity. Repository
      # write access is deliberately absent — only the `tag` job above has it.
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in the build runs git, so the token is not left in the runner's credential helper.
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/belleal/ti-engine-competence
            europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/competence/ti-engine-competence
          # `match` covers a tag pushed by a human. The two `raw` entries cover the dispatch path, where
          # `github.ref` is a branch and so `match` yields nothing; both are inert on a push (`enable=false`).
          tags: |
            type=edge,branch=master
            type=sha
            type=match,pattern=competence-v(.*),group=1
            type=raw,value=${{ needs.tag.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/competence-v') || github.event_name == 'workflow_dispatch' }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/competence/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
