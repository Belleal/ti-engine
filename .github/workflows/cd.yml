name: CD

on:
  push:
    branches: [ master ]
    tags: [ 'competence-v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/belleal/ti-engine-competence
            europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/competence/ti-engine-competence
          tags: |
            type=edge,branch=master
            type=sha
            type=match,pattern=competence-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/competence-v') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/competence/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
