<div class="ti-page" x-data="competenceConsentRegister">

    <div class="ti-page-head competence-insights-head">
        <div>
            <div class="ti-page-eyebrow" x-text-label="interface.insights.eyebrow">Insights</div>
            <h1 class="ti-page-title" x-text-label="interface.consent.register-title">Research Consent Register</h1>
            <p class="ti-page-subtitle" x-text-label="interface.consent.register-intro">Who was asked for research-use consent in this cycle, what they answered, and when.</p>
        </div>
        <label class="competence-insights-picker">
            <span x-text-label="interface.insights.cycle.select-label">Cycle</span>
            <select class="ti-select" x-model="cycleID" x-bind:disabled="busy" @change="loadRegister()">
                <template x-for="cycle in cycles" x-bind:key="cycle.cycleID">
                    <option x-bind:value="cycle.cycleID" x-text="cycle.name"></option>
                </template>
            </select>
        </label>
    </div>

    <section class="ti-panel competence-panel-body">
        <div class="ti-kv-grid">
            <span class="ti-kv-label" x-text-label="interface.consent.count-granted">Granted</span>
            <span class="ti-kv-value" x-text="counts.granted"></span>
            <span class="ti-kv-label" x-text-label="interface.consent.count-declined">Declined</span>
            <span class="ti-kv-value" x-text="counts.declined"></span>
            <span class="ti-kv-label" x-text-label="interface.consent.count-not-asked">Not asked</span>
            <span class="ti-kv-value" x-text="counts.notAsked"></span>
        </div>
    </section>

    <!-- Empty state: no rows for the selected cycle (e.g. nobody in scope yet) -->
    <template x-if="!busy && rows.length === 0">
        <div class="ti-panel">
            <div class="ti-empty-state">
                <div class="ti-empty-state-icon" aria-hidden="true"><span class="ti-icon check-clipboard xl"></span></div>
                <div class="ti-empty-state-title" x-text-label="interface.consent.register-intro">Who was asked for research-use consent in this cycle, what they answered, and when.</div>
            </div>
        </div>
    </template>

    <!-- Register: one row per employee in the selected cycle, including those never asked (decision stays blank) -->
    <template x-if="rows.length > 0">
        <div class="ti-panel">
            <div class="ti-data-grid bordered competence-consent-register-grid">
                <div class="ti-data-grid-head">
                    <span x-text-label="interface.consent.column-employee">Employee</span>
                    <span x-text-label="interface.consent.column-decision">Decision</span>
                    <span x-text-label="interface.consent.column-decided">Date</span>
                    <span x-text-label="interface.consent.column-version">Version</span>
                </div>
                <div class="ti-data-grid-rows">
                    <template x-for="row in rows" x-bind:key="row.employeeID">
                        <div class="ti-data-grid-row" @click="openEvidence(row)">
                            <span x-text="row.employeeName"></span>
                            <span x-text="row.decisionText"></span>
                            <span x-text="formatDate(row.decidedAt)"></span>
                            <span x-text="row.textVersion"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- Evidence: the full consent chain for one employee in this cycle, including superseded records -->
    <section class="ti-panel" x-show="evidence">
        <div class="ti-panel-head">
            <div class="ti-panel-head-text">
                <h2 class="ti-panel-title" x-text-label="interface.consent.evidence-title">Consent evidence</h2>
                <p class="ti-panel-subtitle" x-text="evidence ? evidence.employeeName : ''"></p>
            </div>
            <div class="ti-panel-head-actions">
                <button type="button" class="ti-btn ghost sm" @click="closeEvidence()" x-text-label="interface.consent.evidence-close">Close</button>
            </div>
        </div>
        <p class="ti-panel-body-intro" x-text-label="interface.consent.evidence-intro">Every record for this employee in this cycle, including superseded answers, with the exact statement shown at the time.</p>
        <template x-for="entry in (evidence ? evidence.records : [])" x-bind:key="entry.recordID">
            <div class="ti-form-section">
                <div class="ti-kv-grid">
                    <span class="ti-kv-label" x-text-label="interface.consent.column-decision">Decision</span>
                    <span class="ti-kv-value" x-text="entry.decision"></span>
                    <span class="ti-kv-label" x-text-label="interface.consent.column-decided">Date</span>
                    <span class="ti-kv-value" x-text="formatDate(entry.decidedAt)"></span>
                    <span class="ti-kv-label" x-text-label="interface.consent.column-version">Version</span>
                    <span class="ti-kv-value" x-text="entry.textVersion"></span>
                </div>
                <p class="ti-form-readonly" x-text="entry.body"></p>
                <p class="ti-form-hint" x-show="entry.isSuperseded" x-text-label="interface.consent.evidence-superseded">Superseded</p>
            </div>
        </template>
    </section>
</div>
