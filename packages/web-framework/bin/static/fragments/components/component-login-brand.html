<!-- The login screen's brand block (CA-179): the framework's default, its mark and a generic greeting.

     An application names itself here by shipping its own `fragments/components/component-login-brand.html`, which
     the static-path search resolves in preference to this file. Each string keeps its English as the element's own
     text because an application loads its own labels catalogue, never this package's. -->
<div class="ti-login-brand">
    <div class="ti-login-brand-mark">T</div>
    <div class="ti-login-brand-text">
        <div class="ti-login-brand-title" x-text-label="interface.default.login.welcome">Welcome back</div>
        <div class="ti-login-brand-sub" x-text-label="interface.default.login.sign-in-prompt">Sign in to continue</div>
    </div>
</div>
