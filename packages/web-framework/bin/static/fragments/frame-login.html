<div id="ti-login">
    <div class="ti-login-container">
        <!-- Brand slot. The framework ships a generic default; an application supplies its own
             `fragments/components/component-login-brand.html` to name itself here (CA-179). -->
        <ti-component-login-brand-placeholder></ti-component-login-brand-placeholder>

        <!-- Login card -->
        <div class="ti-login-card">
            <!-- Error message -->
            <!-- The element's own text is the FALLBACK the x-text-label directive falls back to, and it has to be
                 here: this key lives in the framework's web-server-labels.json, and a consuming application
                 configures exactly one labels path — its own — so the framework's catalogue is not loaded and the
                 key does not resolve. An empty element therefore rendered an empty red box: visibly broken, saying
                 nothing. An application that wants this localized adds the key to its own catalogue. -->
            <div id="ti-error"
                 class="ti-login-error"
                 x-data="tiLoginError"
                 x-bind:class="{ visible: hasError }"
                 role="alert"
                 x-text-label="interface.default.login.error-sign-in-failed">Sign-in failed. Please try again.</div>

            <!--ti-auth-method:local-->
            <!-- Local auth form -->
            <form id="ti-login-form" action="/login/local" method="post" class="ti-login-form">
                <input type="hidden" name="_csrf" value='{ti-csrf-placeholder}'>
                <div>
                    <label class="ti-field-label" x-text-label="interface.default.login.username" for="ti-username">Username</label>
                    <input id="ti-username"
                           name="username"
                           autocomplete="username"
                           autocapitalize="none"
                           spellcheck="false"
                           required class="ti-input"
                           x-text-label:placeholder="interface.default.login.username-placeholder"
                           placeholder="Enter your username"/>
                </div>
                <div>
                    <label class="ti-field-label" x-text-label="interface.default.login.password" for="ti-password">Password</label>
                    <input id="ti-password"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           enterkeyhint="go"
                           required class="ti-input"
                           x-text-label:placeholder="interface.default.login.password-placeholder"
                           placeholder="Enter your password"/>
                </div>
                <button type="submit" class="ti-btn primary lg full ti-login-submit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                    </svg>
                    <span x-text-label="interface.default.login.sign-in">Sign In</span>
                </button>
            </form>
            <!--/ti-auth-method-->

            <!--ti-auth-divider-->
            <!-- Divider -->
            <div class="ti-login-divider">
                <div class="ti-login-divider-line"></div>
                <span class="ti-login-divider-label" x-text-label="interface.default.login.or-continue-with">or continue with</span>
                <div class="ti-login-divider-line"></div>
            </div>
            <!--/ti-auth-divider-->

            <!--ti-auth-social-->
            <!-- Social auth -->
            <div class="ti-login-social">
                <!--ti-auth-method:openid-google-->
                <a href="/login/openid-google" class="ti-btn full">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M21.6 12.23c0-.68-.06-1.33-.17-1.96H12v3.71h5.39a4.6 4.6 0 0 1-2 3.02v2.51h3.23c1.9-1.74 2.98-4.31 2.98-7.28Z" fill="#4285F4"/>
                        <path d="M12 22c2.7 0 4.97-.9 6.62-2.42l-3.23-2.51c-.9.6-2.04.96-3.39.96-2.6 0-4.81-1.76-5.6-4.12H3.07v2.6A10 10 0 0 0 12 22Z"
                              fill="#34A853"/>
                        <path d="M6.4 13.91A6.01 6.01 0 0 1 6.4 12c0-.66.11-1.3.31-1.91V7.49H3.07A10 10 0 0 0 2 12c0 1.61.39 3.14 1.07 4.51l3.33-2.6Z"
                              fill="#FBBC05"/>
                        <path d="M12 5.97c1.47 0 2.79.5 3.83 1.5l2.87-2.87C16.96 2.99 14.7 2 12 2A10 10 0 0 0 3.07 7.49l3.33 2.6C7.19 7.73 9.4 5.97 12 5.97Z"
                              fill="#EA4335"/>
                    </svg>
                    <span x-text-label="interface.default.login.sign-in-google">Sign in with Google</span>
                </a>
                <!--/ti-auth-method-->
                <!--ti-auth-method:openid-azure-->
                <a href="/login/openid-azure" class="ti-btn full">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M11.5 2L4 8.5l4 1-4 6.5h8l-2-4 4-1-2.5 8H20L14 2h-2.5Z" fill="#0078D4"/>
                    </svg>
                    <span x-text-label="interface.default.login.sign-in-azure">Sign in with Azure</span>
                </a>
                <!--/ti-auth-method-->
            </div>
            <!--/ti-auth-social-->

            <!--ti-auth-none-->
            <!-- Shown only when no authentication method is enabled/configured. -->
            <div class="ti-login-empty" x-text-label="interface.default.login.no-sign-in-method">No sign-in method is configured. Please contact your administrator.</div>
            <!--/ti-auth-none-->
        </div>

        <!-- Application extension slot. The framework ships this component empty; an application supplies its own
             `fragments/components/component-login-extra.html` and the static-path search picks that over the empty
             default. It exists because the login screen is the one shell an application cannot reach any other way:
             it is rendered before sign-in, so no app fragment is in play, and the alternative was the application
             overriding this whole file and forking the auth-method blocks along with it. -->
        <ti-component-login-extra-placeholder></ti-component-login-extra-placeholder>
    </div>
</div>
